name: Mantener Supabase activo

# El plan gratis de Supabase pausa el proyecto tras 7 días sin actividad.
# Esto hace una consulta liviana cada 3 días. No usa créditos de Netlify.
on:
  schedule:
    - cron: '17 15 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          curl --fail --silent --show-error -X POST \
            "https://yqjuqzmgzydfdaygafgq.supabase.co/rest/v1/rpc/apariencia" \
            -H "apikey: sb_publishable_3L-bruVwjYg8XgZxw6PyFg_9CRYSGA8" \
            -H "Content-Type: application/json" -d '{}'
